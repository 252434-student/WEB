      <label for="email" class="form-label">Электронная почта</label>
      <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Почта@пример.ru">

      <input type="password" class="form-control" id="password" placeholder="Абвг1234">

  </form>
