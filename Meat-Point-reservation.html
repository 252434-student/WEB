<main style="margin-bottom: 30px; padding: 15px">
  <div class="reservation">
    <h2>Забронируйте стол:</h2>
    <form>
    <label for="fname">Ваше Имя: </label>
    <input type="text" id="fname" name="firstname" placeholder="Имя...">
    <label for="lname">Ваша Фамилия: </label>
    <input type="text" id="lname" name="lastname" placeholder="Фамилия...">
    <br>
    <label for="datetime">День и время вашего визита:</label>
    <input type="datetime-local" id="datetime">
    <br>
    <label for="number of seats">Количество стульев:</label>
    <br>
    <input type="number" id="number of seats" min="1" max="10" placeholder="1">
    <br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    </form>
  </div>
</main>
