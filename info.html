<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Page for information about the location">
  <title>Location Info</title>
</head>
<body>
  <h1>Info about Meat Point</h1>
  <hr>
  <h2>Address:</h2>
  <p>Ұлы Дала 45, Астана</p>
  <img src="images/image1.png" width="300" height="200" alt="google maps view"><br>
  <img src="images/image2.png" width="300" height="200" alt="photo of the exterior"><br>
  <img src="images/image3.png" width="300" height="200" alt="photo of the exterior 2">
  <h2>Working hours:</h2>
  <p>24/7</p>
  <h2>Contact Phone:</h2>
  <p>+7-778-422-11-00</p>
  <h2>Social media platforms:</h2>
  <p>Instagram, Threads: @meatpoint.astana</p>
  <h2>Reserve a table:</h2>
  <form>
    <label for="fname">Your first name: </label>
    <input type="text" id="fname" name="firstname" placeholder="Your first name..">
    <label for="lname">Your last name: </label>
    <input type="text" id="lname" name="lastname" placeholder="Your last name..">
    <br>
    <label for="datetime">Date and time of your visit:</label>
    <input type="datetime-local" id="datetime">
    <br>
    <label for="number of seats">Number of seats</label>
    <input type="number" id="number of seats" min="1" max="10">
  </form>
  <a href="/food-menu.html">Take a look at the menu</a>
</body>
</html>
